services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tekstil_erp}
      POSTGRES_USER: ${POSTGRES_USER:-tekstil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yerel_gelistirme_parolasi}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tekstil} -d ${POSTGRES_DB:-tekstil_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tekstil:yerel_gelistirme_parolasi@postgres:5432/tekstil_erp?sslmode=disable}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tekstil:yerel_gelistirme_parolasi@postgres:5432/tekstil_erp?sslmode=disable}
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://yonetim.nizamlarbaski.com}
      AUTH_SECRET: ${AUTH_SECRET:-yerel_gelistirme_guvenlik_anahtari_en_az_32_karakter}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@nizamlar.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-yerel_gelistirme_parolasi}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:

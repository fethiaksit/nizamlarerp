services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tekstil_erp}
      POSTGRES_USER: ${POSTGRES_USER:-tekstil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yerel_gelistirme_parolasi}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tekstil} -d ${POSTGRES_DB:-tekstil_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tekstil:yerel_gelistirme_parolasi@postgres:5432/tekstil_erp?sslmode=disable}
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
